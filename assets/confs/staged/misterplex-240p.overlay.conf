# 240p core on the 480p ABI, on prod conf 933a4104.
# Overlay only: scripts/stage_raster_conf.py puts these keys first (loadConf takes
# the first match) on a byte copy of prod /media/fat/linux/misterplex.conf
# (md5 933a41044fb6605cf629ead07d827ff3), which keeps PLEX_TOKEN out of git and
# keeps AUDIO_DELAY_MS=50. MPX_FPGA_MODE=240p is the key plex_resolve reads for the
# raster (main.cpp exports it from the conf): NTSC fps policy, and the proxy's
# 240crf16 rung (w=320&h=240, no allidr) on every route, since the 240p decoder
# expects coded 320x240 in the 640-pitch DPB. It must carry no DISPLAY_RES,
# CONTENT_RES or MPX_PRESENT_* key (legacy 240p / ARM-present).
MPX_FPGA_MODE=240p
