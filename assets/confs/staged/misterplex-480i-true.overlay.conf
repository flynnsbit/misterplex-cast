# True 480i (Plex_480i core, PLEX_DECODE_CODED_640) on prod conf 933a4104.
# Overlay only: scripts/stage_raster_conf.py puts these keys first (loadConf takes
# the first match) on a byte copy of prod /media/fat/linux/misterplex.conf
# (md5 933a41044fb6605cf629ead07d827ff3), which keeps PLEX_TOKEN out of git and
# keeps AUDIO_DELAY_MS=50. MPX_FPGA_MODE=480i only sets the NTSC fps policy; to
# the daemon true 480i looks like 480p (FPGA store 640x480 @ 0x300FF000). It must
# never carry MPX_PRESENT_480I, DISPLAY_RES=480i or CONTENT_RES=480i: those turn
# on the ARM-present R15 720x480 bank at 0x301FF000.
# FPGA_480P_CODED_W=640 (TRUE640, daemon 5d661805) asks the ladder proxy for the
# coded 640x480 rung (w=640&h=480, crf16 IP); the reader maps x 1:1 across 640 px.
MPX_FPGA_MODE=480i
FPGA_480P_CODED_W=640
